<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Tracker">
<meta name="theme-color" content="#0d6b62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Time Tracker Mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app. Home lists patient profiles; a profile shows two big start/stop buttons, running totals and the stamp log. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #e4eae8;
  --fg: #12201e;
  --muted: #5a6c69;
  --line: #cfd9d6;
  --accent: #0d6b62;
  --accent-fg: #ffffff;
  --test: #1f5fa8;
  --test-soft: #dce9f7;
  --score: #a9600a;
  --score-soft: #f8e6cc;
  --prep: #6a4aa8;
  --prep-soft: #e6def5;
  --st-new: #66766f; --st-new-soft: #e4eae8;
  --st-prog: #1f5fa8; --st-prog-soft: #dce9f7;
  --st-ready: #9a6200; --st-ready-soft: #fbecc8;
  --st-final: #1f7a3d; --st-final-soft: #d9f0df;
  --danger: #b3261e;
  --font-body: "Public Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --surface: #172220; --surface-2: #22312f; --fg: #e6efed; --muted: #94a8a4;
    --line: #2c3d3a; --accent: #43b8aa; --accent-fg: #06201d; --test: #7fb3ee; --test-soft: #1a2e47;
    --score: #f0b45f; --score-soft: #3a2b12; --prep: #b9a2ee; --prep-soft: #2a2140; --st-new: #94a8a4; --st-new-soft: #22312f; --st-prog: #7fb3ee; --st-prog-soft: #1a2e47; --st-ready: #f0c060; --st-ready-soft: #3a2e10; --st-final: #6fd08a; --st-final-soft: #143222; --danger: #f2877f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #172220; --surface-2: #22312f; --fg: #e6efed; --muted: #94a8a4;
  --line: #2c3d3a; --accent: #43b8aa; --accent-fg: #06201d; --test: #7fb3ee; --test-soft: #1a2e47;
  --score: #f0b45f; --score-soft: #3a2b12; --prep: #b9a2ee; --prep-soft: #2a2140; --st-new: #94a8a4; --st-new-soft: #22312f; --st-prog: #7fb3ee; --st-prog-soft: #1a2e47; --st-ready: #f0c060; --st-ready-soft: #3a2e10; --st-final: #6fd08a; --st-final-soft: #143222; --danger: #f2877f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.clock { font-family: var(--font-mono); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.back { min-height: 44px; padding: 0 12px 0 4px; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 130px; min-width: 0; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg);
}
input.initials { font-family: var(--font-mono); font-size: 22px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
input[type="date"], input[type="search"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; line-height: 1.2; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
.search { display: flex; flex-direction: column; gap: 4px; }
.notes { display: flex; flex-direction: column; gap: 6px; }
.notes textarea { min-height: 92px; resize: vertical; line-height: 1.4; }
.prow[data-st="new"] { box-shadow: inset 7px 0 0 var(--st-new); padding-left: 21px; background: var(--st-new-soft); }
.prow[data-st="prog"] { box-shadow: inset 7px 0 0 var(--st-prog); padding-left: 21px; background: var(--st-prog-soft); }
.prow[data-st="ready"] { box-shadow: inset 7px 0 0 var(--st-ready); padding-left: 21px; background: var(--st-ready-soft); }
.prow[data-st="final"] { box-shadow: inset 7px 0 0 var(--st-final); padding-left: 21px; background: var(--st-final-soft); }
.prow .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; white-space: nowrap; background: var(--st-new); color: var(--bg); }
.pill[data-st="prog"] { background: var(--st-prog); }
.pill[data-st="ready"] { background: var(--st-ready); }
.pill[data-st="final"] { background: var(--st-final); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font-family: var(--font-mono); font-size: 12px; opacity: .75; }
.wraphead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chk { display: flex; gap: 14px; align-items: flex-start; min-height: 52px; padding: 6px 0; cursor: pointer; }
.chk input { width: 28px; height: 28px; min-height: 0; padding: 0; flex: none; margin: 2px 0 0; accent-color: var(--accent); }
.chk .t { display: flex; flex-direction: column; min-width: 0; }
.chk .t b { font-weight: 600; }
.btn:disabled { opacity: .4; cursor: default; }
#undoslot:empty { display: none; }
.undo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.undo .row { gap: 8px; }
.undo .btn.small { flex: 1 1 auto; min-height: 44px; }
.banner { display: block; border-radius: 8px; padding: 12px 14px; font-size: 14px; font-weight: 600; text-align: left; width: 100%; min-height: 48px; }
.banner.attn { background: var(--st-ready-soft); color: var(--st-ready); }
.banner.ok { background: var(--st-final-soft); color: var(--st-final); }
.prow .meta .late { color: var(--st-ready); font-weight: 700; }
details.tools { padding: 0; gap: 0; }
details.tools summary { padding: 14px 16px; font-weight: 600; cursor: pointer; min-height: 48px; display: flex; align-items: center; }
details.tools .inner { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
details.tools .field { flex: none; }
.tools h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toast.cheer { background: var(--st-final); color: var(--bg); }
@keyframes pop { from { transform: translateX(-50%) scale(.92); } to { transform: translateX(-50%) scale(1); } }
@media (prefers-reduced-motion: no-preference) { .toast.cheer { animation: pop .25s ease-out; } }
.wknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wknav .btn { min-width: 52px; padding: 0 14px; }
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 126px; }
.bars .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.bars .seg.p { background: var(--prep); } .bars .seg.t { background: var(--test); } .bars .seg.s { background: var(--score); }
.bars .col .seg:first-child { border-radius: 4px 4px 0 0; }
.barlbl { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.barlbl .mono { font-size: 11px; display: block; color: var(--fg); min-height: 1.2em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.stat:first-child { border-top: 0; }
.stat b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.tablewrap { overflow-x: auto; }
.gt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.gt th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 4px 6px; }
.gt td { padding: 9px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.gt th:not(:first-child), .gt td:not(:first-child) { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gt tr.low td { color: var(--muted); }
.hb { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.hb .track { background: var(--surface-2); height: 10px; border-radius: 5px; overflow: hidden; }
.hb .track i { display: block; height: 100%; background: var(--test); border-radius: 5px; }
.hb b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; text-align: right; }
.hb small { color: var(--muted); font-weight: 400; }
.sumbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.sumbtns .btn { flex: 1 1 140px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 8px; font-weight: 600; background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }

.profiles { display: flex; flex-direction: column; gap: 8px; }
.day { margin-top: 4px; }
.prow { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; min-height: 64px; }
.prow .ini { font-family: var(--font-mono); font-weight: 600; font-size: 24px; letter-spacing: .08em; }
.prow .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.prow .meta span { font-size: 13px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.live { color: var(--accent); font-weight: 600; }

.ptitle { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ptitle .ini { font-family: var(--font-mono); font-size: 36px; font-weight: 600; letter-spacing: .08em; }
.ptitle .dt { color: var(--muted); }

.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tgl { min-height: 124px; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; border: 2px solid transparent; }
.tgl .what { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tgl .act { font-size: 24px; font-weight: 700; line-height: 1.1; }
.tgl .sub { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.tgl.test { background: var(--test-soft); color: var(--test); }
.tgl.score { background: var(--score-soft); color: var(--score); }
.tgl.prep { background: var(--prep-soft); color: var(--prep); grid-column: 1 / -1; min-height: 88px; }
.tgl.on.test { background: var(--test); color: var(--bg); }
.tgl.on.score { background: var(--score); color: var(--bg); }
.tgl.on.prep { background: var(--prep); color: var(--bg); }
.tgl:active { transform: scale(.98); }

.sums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sum b { font-family: var(--font-mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum.p b { color: var(--prep); } .sum.t b { color: var(--test); } .sum.s b { color: var(--score); }

.log { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.entry { display: grid; grid-template-columns: 4px 1fr auto auto; gap: 12px; align-items: center; padding: 0 6px 0 0; border-top: 1px solid var(--line); min-height: 56px; }
.entry:first-child { border-top: 0; }
.entry .bar { align-self: stretch; background: var(--muted); }
.entry.prep .bar { background: var(--prep); } .entry.test .bar { background: var(--test); } .entry.score .bar { background: var(--score); }
.entry .txt { padding: 8px 0; min-width: 0; display: flex; flex-direction: column; }
.entry .txt b { font-weight: 600; }
.entry .txt span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.entry .tm { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .edit { min-width: 44px; min-height: 44px; color: var(--muted); font-size: 13px; font-weight: 600; }
.empty { padding: 20px 16px; color: var(--muted); text-align: center; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.dayhead .mono { font-size: 12px; color: var(--muted); font-weight: 500; }
.dayhead + .entry { border-top: 0; }

.sheet { position: fixed; inset: 0; background: rgba(8,16,15,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet .panel { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 18px; }
textarea.out { font-family: var(--font-mono); font-size: 13px; min-height: 160px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: 90%; }
.warn { background: var(--score-soft); color: var(--score); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .tgl { transition: transform .08s; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
(function () {
  var KEY = 'testingTimeLog.v1';
  var state = { profiles: [], activeId: null, archive: [], settings: { purgeDays: 0, lastBackup: null, keepArchive: true } };
  var storageOk = true;
  var view = 'home';
  var query = '';
  var statusFilter = 'all';
  var period = 'week';
  var lastStamp = null, lastUndo = '', weekOffset = 0, toolsOpen = false, pendingToast = '';
  var STATUS = { new: { label: 'Not started' }, prog: { label: 'In progress' }, ready: { label: 'Ready to transfer' }, final: { label: 'Finalized' } };
  var STORDER = ['new', 'prog', 'ready', 'final'];
  function status(p) { if (p.final) return 'final'; if (p.done) return 'ready'; return p.entries.length ? 'prog' : 'new'; }
  function chipsHtml() {
    if (!state.profiles.length) return '';
    var c = { all: state.profiles.length };
    STORDER.forEach(function (k) { c[k] = 0; });
    state.profiles.forEach(function (p) { c[status(p)]++; });
    var items = [['all', 'All']].concat(STORDER.map(function (k) { return [k, STATUS[k].label]; }));
    return '<div class="chips" role="group" aria-label="Filter by status">' + items.map(function (x) {
      return '<button class="chip" data-act="filter" data-st="' + x[0] + '" aria-pressed="' + (statusFilter === x[0]) + '">' + x[1] + ' <span class="n">' + c[x[0]] + '</span></button>';
    }).join('') + '</div>';
  }
  function checkedLine(ts, fallback) { return ts ? 'Checked ' + fmtShort(ts) + ' at ' + fmtTime(ts) : fallback; }
  function wrapHtml(p) {
    var st = status(p);
    return '<div class="wraphead"><p class="label">Wrap-up</p><span class="pill" data-st="' + st + '">' + STATUS[st].label + '</span></div>' +
      '<label class="chk"><input type="checkbox" id="chkDone"' + (p.done ? ' checked' : '') + '><span class="t"><b>Testing and scoring complete</b><span class="hint">' + checkedLine(p.done && p.doneAt, 'Check when all times are logged here') + '</span></span></label>' +
      '<label class="chk"><input type="checkbox" id="chkFinal"' + (p.final ? ' checked' : '') + '><span class="t"><b>Entered on master tracker</b><span class="hint">' + checkedLine(p.final && p.finalAt, 'Check after updating the clinic drive tracker') + '</span></span></label>';
  }

  // When a profile is deleted, keep an anonymous record (no initials, no notes) so the summaries still count its times.
  function archiveProfile(p) {
    if (!state.settings.keepArchive || p.example || !p.entries || !p.entries.length) return;
    var r = { id: 'a' + uid(), archived: true, entries: p.entries.map(function (e) { return { id: e.id, type: e.type, ts: e.ts }; }) };
    if (p.ageGroup) r.ageGroup = p.ageGroup;
    if (p.language) r.language = p.language;
    if (p.referrals && p.referrals.length) r.referrals = p.referrals.slice();
    if (p.done) { r.done = true; if (p.doneAt) r.doneAt = p.doneAt; }
    if (p.final) { r.final = true; if (p.finalAt) r.finalAt = p.finalAt; }
    state.archive.push(r);
  }
  function cleanArchive(x) {
    if (!x || typeof x.id !== 'string' || !Array.isArray(x.entries)) return null;
    var es = [];
    x.entries.forEach(function (e) { if (e && TYPES[e.type] && typeof e.ts === 'number' && isFinite(e.ts)) es.push({ id: 'e' + es.length, type: e.type, ts: e.ts }); });
    if (!es.length) return null;
    var r = { id: x.id, archived: true, entries: es };
    if (AGES.some(function (a) { return a[0] === x.ageGroup; })) r.ageGroup = x.ageGroup;
    if (LANGS.some(function (a) { return a[0] === x.language; })) r.language = x.language;
    if (Array.isArray(x.referrals)) r.referrals = x.referrals.filter(function (q) { return REFS.some(function (a) { return a[0] === q; }); });
    if (x.done) { r.done = true; if (+x.doneAt) r.doneAt = +x.doneAt; }
    if (x.final) { r.final = true; r.done = true; if (+x.finalAt) r.finalAt = +x.finalAt; }
    return r;
  }
  // Removes finalized profiles older than the chosen number of days. Returns how many were removed.
  function purgeOld() {
    var days = +state.settings.purgeDays || 0; if (!days) return 0;
    var cut = Date.now() - days * 86400000, before = state.profiles.length;
    var keep = [], gone = [];
    state.profiles.forEach(function (p) { (p.final && p.finalAt && p.finalAt < cut ? gone : keep).push(p); });
    gone.forEach(archiveProfile);
    state.profiles = keep;
    var n = before - state.profiles.length;
    if (n) { save(); pendingToast = 'Removed ' + n + ' finalized profile' + (n === 1 ? '' : 's') + ' older than ' + days + ' days'; }
    return n;
  }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.profiles)) state.profiles = d.profiles;
        if (d && d.settings && typeof d.settings === 'object') { state.settings.purgeDays = +d.settings.purgeDays || 0; state.settings.lastBackup = +d.settings.lastBackup || null; state.settings.keepArchive = d.settings.keepArchive !== false; }
        if (d && Array.isArray(d.archive)) state.archive = d.archive.map(cleanArchive).filter(Boolean);
        purgeOld();
      }
      else { seed(); }
    } catch (e) { storageOk = false; seed(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ profiles: state.profiles, archive: state.archive, settings: state.settings })); storageOk = true; }

  function hay(p) {

      var ty = sel.value, note = document.getElementById('snote').value.trim(), lb = ty === 'other' ? (document.getElementById('slabel').value.trim() || 'Note') : '';
      if (isEdit) { entry.type = ty; entry.ts = when; entry.note = note || undefined; entry.label = lb || undefined; save(); }
      else addEntry(p, ty, when, note, lb);
      layer.innerHTML = ''; render(); toast(isEdit ? 'Saved' : 'Added');
    });
    sel.focus();
  }

  function openProfileSheet(p) {
    layer.innerHTML = '<div class="sheet"><form class="panel" id="profForm" role="dialog" aria-label="Edit profile" autocomplete="off">' +
      '<h2>Edit profile</h2>' +
      '<div class="row"><div class="field" style="flex:0 1 120px"><label class="hint" for="eini">Initials</label><input id="eini" class="initials" maxlength="4" autocapitalize="characters" required value="' + esc(p.initials) + '"></div>' +
      '<div class="field"><label class="hint" for="edate">First day of testing</label><input id="edate" type="date" required value="' + esc(p.date) + '"></div></div>' +
      '<p class="hint">This sets where the profile is filed in your history. Stamps already logged keep their own dates.</p>' +
      '<button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="closesheet">Cancel</button></form></div>';
    document.getElementById('profForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var ini = document.getElementById('eini').value.trim().toUpperCase().replace(/[^A-Z]/g, '');
      var date = document.getElementById('edate').value;
      if (!ini || !date) { toast('Enter initials and a date'); return; }
      var clash = state.profiles.some(function (x) { return x.id !== p.id && x.initials === ini && x.date === date; });
      if (clash) { toast('Another profile already has those initials and date'); return; }
      p.initials = ini; p.date = date; save(); layer.innerHTML = ''; render(); toast('Profile updated');
    });
    document.getElementById('eini').focus();
  }

  function openRestoreSheet() {
    layer.innerHTML = '<div class="sheet"><form class="panel" id="restoreForm" role="dialog" aria-label="Restore from backup"><h2>Restore from backup</h2>' +
      '<p class="hint">Paste the backup text. Profiles that are not already on this phone are added. Profiles you already have are not changed.</p>' +
      '<textarea id="rtext" class="out" placeholder="Paste backup text here" required></textarea>' +
      '<button class="btn primary" type="submit">Restore</button><button class="btn" type="button" data-act="closesheet">Cancel</button></form></div>';
    document.getElementById('rtext').focus();
  }

  var armed = null;
  function arm(btn, text, fn) {
    if (armed && armed.btn === btn) { clearTimeout(armed.t); armed = null; fn(); return; }
    if (armed) { clearTimeout(armed.t); armed.btn.textContent = armed.orig; }
    var orig = btn.textContent; btn.textContent = text;
    armed = { btn: btn, orig: orig, t: setTimeout(function () { btn.textContent = orig; armed = null; }, 3000) };
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), p = active();
    if (act === 'open') { state.activeId = el.getAttribute('data-id'); view = 'profile'; render(); window.scrollTo(0, 0); }
    else if (act === 'home') { view = 'home'; state.activeId = null; render(); }
    else if (act === 'toggle') {
      var cat = el.getAttribute('data-cat'), t = totals(p), on = t[cat].open != null;
      var ne = addEntry(p, cat + (on ? '_end' : '_start'), Date.now());
      lastStamp = { pid: p.id, eid: ne.id, until: Date.now() + 120000 };
      render(); toast(CATNAME[cat] + ' ' + (on ? 'ended ' : 'started ') + fmtTime(Date.now()));
    }
    else if (act === 'manual') openSheet(null);
    else if (act === 'editprofile') openProfileSheet(p);
    else if (act === 'filter') { statusFilter = el.getAttribute('data-st'); render(); }
    else if (act === 'summary') { view = 'summary'; weekOffset = 0; render(); window.scrollTo(0, 0); }
    else if (act === 'period') { period = el.getAttribute('data-p'); weekOffset = 0; render(); }
    else if (act === 'copysumtext') copyOrShow(summaryText(summaryModel()), 'Summary');
    else if (act === 'copysumsheet') copyOrShow(summarySheet(summaryModel()), 'Summary for spreadsheet');
    else if (act === 'ref') {
      if (p) {
        var rk = el.getAttribute('data-ref'); p.referrals = p.referrals || [];
        var ix = p.referrals.indexOf(rk); if (ix > -1) p.referrals.splice(ix, 1); else p.referrals.push(rk);
        save(); el.setAttribute('aria-pressed', ix === -1 ? 'true' : 'false');
      }
    }
    else if (act === 'weekprev') { weekOffset--; render(); }
    else if (act === 'weeknext') { if (weekOffset < 0) weekOffset++; render(); }
    else if (act === 'shift') {
      var se = lastStamp && p && p.entries.find(function (x) { return x.id === lastStamp.eid; });
      if (se) { se.ts -= (+el.getAttribute('data-min')) * 60000; lastStamp.until = Date.now() + 120000; save(); render(); toast('Moved to ' + fmtTime(se.ts)); }
    }
    else if (act === 'undostamp') {
      if (lastStamp && p) { p.entries = p.entries.filter(function (x) { return x.id !== lastStamp.eid; }); lastStamp = null; save(); render(); toast('Stamp removed'); }
    }
    else if (act === 'backup') {
      var payload = JSON.stringify({ app: 'time-tracker-mobile', version: 1, exported: new Date().toISOString(), profiles: state.profiles, archive: state.archive, settings: state.settings });
      state.settings.lastBackup = Date.now(); save(); copyOrShow(payload, 'Backup'); render();
    }
    else if (act === 'restore') openRestoreSheet();
    else if (act === 'erasearchive') {
      var na = state.archive.length;
      arm(el, 'Tap again to erase ' + na + ' record' + (na === 1 ? '' : 's'), function () { state.archive = []; save(); render(); toast('Anonymous records erased'); });
    }
    else if (act === 'clearfinal') {
      var nf = state.profiles.filter(function (x) { return x.final; }).length;
      arm(el, 'Tap again to delete ' + nf + ' finalized', function () {
        state.profiles.filter(function (x) { return x.final; }).forEach(archiveProfile);
        state.profiles = state.profiles.filter(function (x) { return !x.final; }); save(); render(); toast('Finalized profiles deleted');
      });
    }
    else if (act === 'edit') { var e = p.entries.find(function (x) { return x.id === el.getAttribute('data-id'); }); if (e) openSheet(e); }
    else if (act === 'closesheet') layer.innerHTML = '';
    else if (act === 'delentry') arm(el, 'Tap again to delete', function () {
      p.entries = p.entries.filter(function (x) { return x.id !== el.getAttribute('data-id'); }); save(); layer.innerHTML = ''; render(); toast('Deleted');
    });
    else if (act === 'delprofile') arm(el, 'Tap again to delete profile' + (state.settings.keepArchive ? ' (anonymous times are kept)' : ' and its log'), function () {
      archiveProfile(p);
      state.profiles = state.profiles.filter(function (x) { return x.id !== p.id; }); save(); view = 'home'; state.activeId = null; render();
    });
    else if (act === 'copy') copyOrShow(logText(p), 'Log for ' + p.initials);
    else if (act === 'copyall') copyOrShow(state.profiles.slice().sort(function (a, b) { return a.date.localeCompare(b.date) || a.createdAt - b.createdAt; }).map(logText).join('\n\n'), 'All logs');
  });

  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'newForm') return;
    ev.preventDefault();
    var ini = document.getElementById('ini').value.trim().toUpperCase().replace(/[^A-Z]/g, '');
    var date = document.getElementById('pdate').value;
    if (!ini || !date) { toast('Enter initials and a date'); return; }
    var existing = state.profiles.find(function (x) { return x.initials === ini && x.date === date && !x.example; });
    if (existing) { state.activeId = existing.id; view = 'profile'; render(); toast('Profile already exists. Opened it.'); return; }
    var np = { id: uid(), initials: ini, date: date, createdAt: Date.now(), entries: [] };
    state.profiles.push(np); save(); state.activeId = np.id; view = 'profile'; render(); window.scrollTo(0, 0);
  });

  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'restoreForm') return;
    ev.preventDefault();
    var data;
    try { data = JSON.parse(document.getElementById('rtext').value.trim()); } catch (e) { toast('That does not look like backup text'); return; }
    var list = data && Array.isArray(data.profiles) ? data.profiles : null;
    if (!list) { toast('No profiles found in that text'); return; }
    var have = {}; state.profiles.forEach(function (p) { have[p.id] = 1; });
    var added = 0;
    list.forEach(function (x) { var c = cleanProfile(x); if (c && !have[c.id]) { state.profiles.push(c); have[c.id] = 1; added++; } });
    var addedA = 0, haveA = {}; state.archive.forEach(function (a) { haveA[a.id] = 1; });
    (Array.isArray(data.archive) ? data.archive : []).forEach(function (x) { var c = cleanArchive(x); if (c && !haveA[c.id]) { state.archive.push(c); haveA[c.id] = 1; addedA++; } });
    save(); layer.innerHTML = ''; render();
    toast(added || addedA ? 'Restored ' + added + ' profile' + (added === 1 ? '' : 's') + (addedA ? ' and ' + addedA + ' anonymous record' + (addedA === 1 ? '' : 's') : '') : 'Nothing new to restore');
  });

  document.addEventListener('toggle', function (ev) { if (ev.target && ev.target.id === 'tools') toolsOpen = ev.target.open; }, true);

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.id === 'purge') {
      state.settings.purgeDays = +el.value; save();
      var n = purgeOld();
      if (n) { render(); toast(pendingToast); pendingToast = ''; }
      else toast(+el.value ? 'Finalized profiles will be deleted after ' + el.value + ' days' : 'Auto-delete is off');
      return;
    }
    if (el.id === 'keepArch') { state.settings.keepArchive = el.checked; save(); toast(el.checked ? 'Anonymous times will be kept' : 'Deleted profiles will be removed completely'); return; }
    if (el.id === 'pAge' || el.id === 'pLang') {
      var dp = active();
      if (dp) { if (el.id === 'pAge') dp.ageGroup = el.value || undefined; else dp.language = el.value || undefined; save(); }
      return;
    }
    if (el.id !== 'chkDone' && el.id !== 'chkFinal') return;
    var p = active(); if (!p) return;
    var now = Date.now(), msg;
    if (el.id === 'chkDone') {
      p.done = el.checked;
      if (el.checked) { p.doneAt = now; msg = 'Marked complete'; }
      else { p.doneAt = undefined; p.final = false; p.finalAt = undefined; msg = 'Marked in progress'; }
    } else {
      p.final = el.checked;
      if (el.checked) { p.finalAt = now; if (!p.done) { p.done = true; p.doneAt = now; } msg = 'Marked finalized'; }
      else { p.finalAt = undefined; msg = 'Back to ready to transfer'; }
    }
    save();
    var w = document.getElementById('wrapup'); if (w) w.innerHTML = wrapHtml(p);
    if (el.id === 'chkFinal' && el.checked) {
      var left = state.profiles.filter(function (x) { return status(x) === 'ready'; }).length;
      if (!left) { toast('\u2713 All caught up. Nothing is waiting for the master tracker.', true); return; }
    }
    toast(msg);
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'q') { query = el.value; var pl = document.getElementById('plist'); if (pl) pl.innerHTML = listHtml(); }
    else if (el.id === 'pnotes') { var np2 = active(); if (np2) { np2.notes = el.value; save(); } }
    else if (el.id === 'stime') {
      var dg = el.value.replace(/\D/g, '').slice(0, 4);
      el.value = dg.length > 2 ? dg.slice(0, 2) + ':' + dg.slice(2) : dg;
    }
  });

  setInterval(function () {
    tickClock();
    var p = view === 'profile' ? active() : null;
    if (p) {
      var s = document.getElementById('sums'); if (s) s.innerHTML = sumsHtml(p);
      var u = document.getElementById('undoslot');
      if (u) { var h = undoHtml(p); if (h !== lastUndo) { u.innerHTML = h; lastUndo = h; } }
    }
  }, 1000);

  load(); render();
  if (pendingToast) { toast(pendingToast); pendingToast = ''; }
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
